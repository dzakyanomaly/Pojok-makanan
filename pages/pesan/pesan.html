<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pojok Makanan - Component</title>
  </head>
  <body>
<section id="page-pesan" class="page-view space-y-4 pb-16">
  <div>
    <span class="text-xs font-bold uppercase tracking-wider text-[#2D6A4F]">Pusat Koordinasi Pangan</span>
    <h1 class="font-serif text-3xl font-bold text-[#24201D]">
      Pesan & Chat
    </h1>
    <p class="text-xs sm:text-sm text-[#6C6259]">
      Komunikasi langsung dengan pemberi donasi, pengelola lemari berbagi, dan relawan kurir.
    </p>
  </div>

  <div class="bg-white rounded-3xl border border-[#E8DFD1] shadow-xs overflow-hidden grid grid-cols-1 md:grid-cols-12 min-h-[580px] h-[72vh]">
    <!-- Left side: chat threads list -->
    <div
      id="chat-thread-list"
      class="md:col-span-5 lg:col-span-4 border-r border-[#E8DFD1] flex flex-col bg-[#FAF6F0]/40 overflow-y-auto divide-y divide-[#F0EAE1]"
    >
      <!-- Populated in pesan.js -->
    </div>

    <!-- Right side: active chat conversation -->
    <div class="md:col-span-7 lg:col-span-8 flex flex-col bg-white">
      <div
        id="chat-header"
        class="p-3.5 sm:p-4 border-b border-[#E8DFD1] bg-[#FAF6F0]/80 flex items-center justify-between gap-3"
      >
        <!-- Populated in pesan.js -->
      </div>
      <div
        id="chat-messages-container"
        class="flex-1 overflow-y-auto p-4 sm:p-5 space-y-3 bg-[#FCFAF6]"
      >
        <!-- Message bubbles populated in pesan.js -->
      </div>
      <!-- Quick Reply Chips -->
      <div class="px-4 py-2 bg-[#FAF6F0] border-t border-[#E8DFD1] flex items-center gap-2 overflow-x-auto scrollbar-none">
        <button class="quick-reply-btn px-2.5 py-1 rounded-full bg-white border border-[#D9CDBF] text-[11px] text-[#594A38] hover:border-[#2D6A4F] whitespace-nowrap cursor-pointer">
          Saya sedang dalam perjalanan ke titik ambil
        </button>
        <button class="quick-reply-btn px-2.5 py-1 rounded-full bg-white border border-[#D9CDBF] text-[11px] text-[#594A38] hover:border-[#2D6A4F] whitespace-nowrap cursor-pointer">
          Apakah makanannya masih tersedia?
        </button>
        <button class="quick-reply-btn px-2.5 py-1 rounded-full bg-white border border-[#D9CDBF] text-[11px] text-[#594A38] hover:border-[#2D6A4F] whitespace-nowrap cursor-pointer">
          Terima kasih banyak, berkah selalu!
        </button>
      </div>
      <!-- Chat Input -->
      <div class="p-3 sm:p-4 bg-white border-t border-[#E8DFD1] flex items-center gap-2">
        <input
          type="text"
          id="chat-input"
          placeholder="Ketik pesan konfirmasi pengambilan atau pertanyaan..."
          class="flex-1 px-4 py-2.5 rounded-xl border border-[#D9CDBF] bg-[#FAF6F0]/60 text-xs sm:text-sm text-[#24201D] focus:outline-none focus:ring-2 focus:ring-[#2D6A4F]"
        />
        <button
          id="btn-send-chat"
          class="p-2.5 px-4 rounded-xl bg-[#2D6A4F] text-white hover:bg-[#1B4332] active:scale-95 transition cursor-pointer shadow-xs text-xs font-bold inline-flex items-center gap-1.5"
        >
          <span>Kirim</span>
          <i data-lucide="send" class="w-3.5 h-3.5"></i>
        </button>
      </div>
    </div>
  </div>
</section>

  </body>
</html>
