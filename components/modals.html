<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pojok Makanan - Component</title>
  </head>
  <body>
<!-- Food Detail Modal -->
<div id="food-detail-modal" class="modal-backdrop fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-xs hidden">
  <div class="bg-white rounded-3xl max-w-xl w-full max-h-[90vh] overflow-y-auto border border-[#E8DFD1] shadow-2xl relative">
    <button id="btn-close-detail" class="absolute top-4 right-4 z-10 w-9 h-9 rounded-full bg-black/60 text-white hover:bg-black flex items-center justify-center backdrop-blur-xs cursor-pointer">
      âœ•
    </button>
    <div id="modal-detail-content">
      <!-- Populated dynamically -->
    </div>
  </div>
</div>

<!-- Food Claim Modal -->
<div id="claim-modal" class="modal-backdrop fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-xs hidden">
  <div class="bg-white rounded-3xl max-w-md w-full p-6 sm:p-7 border border-[#E8DFD1] shadow-2xl space-y-4">
    <div class="flex items-start justify-between border-b border-[#F0EAE1] pb-3">
      <div>
        <span class="text-xs font-bold text-[#2D6A4F] uppercase tracking-wider">Konfirmasi Pengambilan</span>
        <h3 class="font-serif text-xl font-bold text-[#24201D] mt-0.5">Klaim Porsi Makanan</h3>
      </div>
      <button id="btn-close-claim" class="w-8 h-8 rounded-full bg-[#FAF6F0] text-[#7D7166] hover:text-[#24201D] flex items-center justify-center cursor-pointer">
        âœ•
      </button>
    </div>
    <div id="claim-modal-body" class="space-y-4">
      <!-- Populated dynamically -->
    </div>
  </div>
</div>

<!-- Edit Profile Modal -->
<div id="edit-profile-modal" class="modal-backdrop fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-xs hidden">
  <div class="bg-white rounded-3xl max-w-md w-full p-6 sm:p-8 border border-[#E8DFD1] shadow-2xl space-y-4">
    <div class="flex items-center justify-between border-b border-[#F0EAE1] pb-3">
      <h3 class="font-serif text-2xl font-bold text-[#24201D]">Ubah Data Profil</h3>
      <button id="btn-close-edit-profile" class="w-8 h-8 rounded-full bg-[#FAF6F0] text-[#7D7166] hover:text-[#24201D] flex items-center justify-center cursor-pointer">
        âœ•
      </button>
    </div>
    <form id="edit-profile-form" class="space-y-3">
      <div>
        <label class="block text-xs font-bold text-[#3D332A] uppercase tracking-wider mb-1">Nama Lengkap</label>
        <input type="text" id="edit-name" required class="w-full px-3.5 py-2 rounded-xl border border-[#D9CDBF] bg-[#FAF6F0]/50 text-sm focus:ring-2 focus:ring-[#2D6A4F]" />
      </div>
      <div>
        <label class="block text-xs font-bold text-[#3D332A] uppercase tracking-wider mb-1">No. WhatsApp</label>
        <input type="text" id="edit-phone" required class="w-full px-3.5 py-2 rounded-xl border border-[#D9CDBF] bg-[#FAF6F0]/50 text-sm focus:ring-2 focus:ring-[#2D6A4F]" />
      </div>
      <div>
        <label class="block text-xs font-bold text-[#3D332A] uppercase tracking-wider mb-1">Kota / Wilayah</label>
        <input type="text" id="edit-city" required class="w-full px-3.5 py-2 rounded-xl border border-[#D9CDBF] bg-[#FAF6F0]/50 text-sm focus:ring-2 focus:ring-[#2D6A4F]" />
      </div>
      <div class="flex justify-end gap-2 pt-2 border-t border-[#F0EAE1]">
        <button type="button" id="btn-cancel-edit-profile" class="px-4 py-2 rounded-xl border border-[#D9CDBF] text-xs font-semibold text-[#594A38] cursor-pointer">
          Batal
        </button>
        <button type="submit" class="px-6 py-2 rounded-xl bg-[#2D6A4F] text-white text-xs font-bold hover:bg-[#1B4332] cursor-pointer">
          Simpan Profil
        </button>
      </div>
    </form>
  </div>
</div>

<!-- Article Reader Modal -->
<div id="article-modal" class="modal-backdrop fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-xs hidden">
  <div class="bg-white rounded-3xl max-w-2xl w-full max-h-[90vh] overflow-y-auto border border-[#E8DFD1] shadow-2xl p-6 sm:p-8 space-y-4 relative">
    <button id="btn-close-article" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-[#FAF6F0] text-[#7D7166] flex items-center justify-center cursor-pointer">
      âœ•
    </button>
    <div id="article-modal-content">
      <!-- Populated dynamically -->
    </div>
  </div>
</div>

  </body>
</html>
